name: Paper image
on:
  pull_request:
    paths: ['images/paper/**', 'tools/**', 'tests/**', 'api/**', 'Makefile', 'requirements-dev.txt', '.github/workflows/paper.yml']
  push:
    branches: [main]
    paths: ['images/paper/**', 'tools/**', 'tests/**', 'api/**', 'Makefile', 'requirements-dev.txt', '.github/workflows/paper.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor policy otherwise blocks bubblewrap namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          make tools
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make check build
      - name: Load and smoke test image
        run: |
          docker load -i build/paper/image.tar
          make smoke
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: squab-paper:verify-amd64
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image and render catalog candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/squab-dev/squab-templates/paper:sha-$GITHUB_SHA"
          docker tag squab-paper:verify-amd64 "$image"
          docker push "$image"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          python3 tools/render-manifest.py --image "$ref" --output build/paper/template.json
          echo "Paper image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload catalog candidate and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-${{ github.sha }}
          path: |
            build/paper/template.json
            build/paper/sbom/
          if-no-files-found: error
