name: Verify image
on:
  workflow_call:
    inputs:
      game:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GAME: ${{ inputs.game }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          make tools
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make check build GAME="$GAME"
      - name: Load and smoke test image
        run: |
          docker load -i "build/$GAME/image.tar"
          make smoke GAME="$GAME"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: squab-${{ inputs.game }}:verify-amd64
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GHCR
        if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="ghcr.io/squab-dev/squab-templates/$GAME:sha-$GITHUB_SHA"
          docker tag "squab-$GAME:verify-amd64" "$image"
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" > "build/$GAME/image-reference.txt"
          echo "Published $GAME: $(cat "build/$GAME/image-reference.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified reference and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ inputs.game }}
          path: |
            build/${{ inputs.game }}/image-reference.txt
            build/${{ inputs.game }}/sbom/
          if-no-files-found: error
