services:
  hytale:
    # Set this to the published ghcr.io/squab-dev/squab-templates/hytale@sha256:... reference.
    image: ${HYTALE_IMAGE:?Set a digest-pinned Hytale image}
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    stop_grace_period: 120s
    mem_limit: 6g
    cpus: 3
    ports: ['5520:5520/udp']
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
