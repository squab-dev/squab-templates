contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - busybox
    - python-3.14
    - ca-certificates-bundle
    - openjdk-8-jre=8.504-r3
    - openjdk-17-jre=17.0.20.1-r5
    - openjdk-21-jre=21.0.12.1-r3
    - openjdk-25-jre=25.0.4.1-r2
    - squab-curseforge-launcher=0.1.0-r0
accounts:
  groups:
    - groupname: squab
      gid: 65532
  users:
    - username: squab
      uid: 65532
      gid: 65532
  run-as: 65532
work-dir: /data
entrypoint:
  command: /usr/local/bin/squab-curseforge-launcher
environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  HOME: /data/.squab-curseforge/home
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o750
archs:
  - x86_64
