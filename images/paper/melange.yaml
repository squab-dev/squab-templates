package:
  name: squab-paper-launcher
  version: 0.1.0
  epoch: 1
  description: Squab launcher for the Wing-verified Paper runtime
  copyright:
    - license: LicenseRef-Proprietary
  dependencies:
    runtime:
      - busybox
      - python-3.14
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - runs: |
      install -Dm0555 squab-paper-update "${{targets.destdir}}/usr/local/bin/squab-paper-update"
      install -Dm0555 squab-paper-launcher "${{targets.destdir}}/usr/local/bin/squab-paper-launcher"
