contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle
    - openjdk-25-jre=25.0.4.1-r1
    - squab-paper-launcher=0.1.0-r0
accounts:
  groups:
    - groupname: squab
      gid: 65532
  users:
    - username: squab
      uid: 65532
      gid: 65532
  run-as: 65532
work-dir: /data
entrypoint:
  command: /usr/local/bin/squab-paper-launcher
environment:
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/local/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
archs:
  - x86_64
