contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle
    - python-3.14
    - libstdc++
    - libatomic
    - alsa-lib
    - libpulse
    - libx11
    - squab-palworld-launcher=0.1.0-r0
accounts:
  groups:
    - groupname: squab
      gid: 65532
  users:
    - username: squab
      uid: 65532
      gid: 65532
  run-as: 65532
work-dir: /data
entrypoint:
  command: /usr/local/bin/squab-palworld-launcher
environment:
  HOME: /tmp/palworld
  PATH: /usr/local/bin:/usr/bin:/bin
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o750
archs:
  - x86_64
